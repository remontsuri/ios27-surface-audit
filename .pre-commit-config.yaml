# Pre-commit configuration for this repository.
#
# Only upstream, maintained hook collections are listed here, so anyone who clones the
# repository and runs `pre-commit install` gets exactly the same checks. Project-specific
# publishing policy (identity strings, device identifiers, language) is intentionally NOT
# encoded here: it belongs to the maintainer's machine, not to the public repository.
#
#   pip install pre-commit
#   pre-commit install
#   pre-commit run --all-files

default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
